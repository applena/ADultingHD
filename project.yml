name: ADultingHD
options:
  bundleIdPrefix: net.shadowpuppet
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: TYQ32QCF6K
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: 44
    SWIFT_VERSION: "6.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  ADultingHD_iOS:
    build:
      targets:
        ADultingHD_iOS: all
        ADultingHDUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ADultingHDTests_iOS
        - ADultingHDUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  ADultingHD_macOS:
    build:
      targets:
        ADultingHD_macOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ADultingHDTests_macOS
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  ADultingHD:
    type: application
    platform: [iOS, macOS]
    sources:
      - ADultingHD
      - path: Shared/SharedDefaults.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.ADultingHD
        DEVELOPMENT_TEAM: TYQ32QCF6K
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: ADultingHD
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: ADultingHD/App/Info.plist
      properties:
        CFBundleDisplayName: ADultingHD
        CKSharingSupported: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.lifestyle
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: ADultingHD/App/ADultingHD.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.net.shadowpuppet.ADultingHD
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.net.shadowpuppet.ADultingHD
        com.apple.developer.icloud-services:
          - CloudDocuments
          - CloudKit
        aps-environment: development

  ADultingHDWidget:
    type: app-extension
    platform: iOS
    deploymentTarget:
      iOS: "17.0"
    sources:
      - ADultingHDWidget
      - path: Shared/SharedDefaults.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.ADultingHD.widget
        DEVELOPMENT_TEAM: TYQ32QCF6K
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: 44
    entitlements:
      path: ADultingHDWidget/ADultingHDWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.shadowpuppet.ADultingHD

  ADultingHDTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ADultingHDTests
    dependencies:
      - target: ADultingHD_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.ADultingHD.tests
        GENERATE_INFOPLIST_FILE: YES

  ADultingHDTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ADultingHDTests
    dependencies:
      - target: ADultingHD_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.ADultingHD.tests
        GENERATE_INFOPLIST_FILE: YES

  ADultingHDUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ADultingHDUITests
    dependencies:
      - target: ADultingHD_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.ADultingHD.uitests
        GENERATE_INFOPLIST_FILE: YES
